name: CI and production deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qingsu-admin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the paired main-app revision
        run: |
          APP_SHA=$(grep -Ev '^\s*(#|$)' deploy/APP_REVISION | head -1 | tr -d '[:space:]')
          case "$APP_SHA" in
            ''|PLACEHOLDER*) echo "deploy/APP_REVISION 还没填成真实 SHA：跨仓判据会跟着 main 浮动跑，" \
                              "后台绿而线上主应用是另一版时没人看得出来。" >&2; exit 1;;
          esac
          echo "APP_SHA=$APP_SHA" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          repository: clowndest-svg/JianZhiSuXingRuanJian
          ref: ${{ env.APP_SHA }}
          path: main-app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r main-app/requirements-dev.txt
      - name: Record which two revisions this run proves compatible
        run: |
          {
            echo "## 跨仓配对"
            echo "- 后台源码：$GITHUB_SHA"
            echo "- 主应用源码：$APP_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run isolated admin API and data-safety tests
        env:
          QINGSU_APP_REPO: ${{ github.workspace }}/main-app
        run: python tests/test_ops_api.py
      - name: Verify cross-repository session, export and deletion boundaries
        env:
          QINGSU_APP_REPO: ${{ github.workspace }}/main-app
          QINGSU_ADMIN_REPO: ${{ github.workspace }}
        run: python main-app/tests/test_optimization_security.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    environment:
      name: production
      url: https://124.220.54.64/ops/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package the two deployed admin files
        run: |
          python - <<'PY'
          import os
          import tarfile
          with tarfile.open(os.path.join(os.environ["RUNNER_TEMP"], "qingsu-admin.tar"), "w") as archive:
              archive.add("ops/admin_api.py", arcname="ops/admin_api.py")
              archive.add("ops/console.html", arcname="ops/console.html")
          PY
      - name: Upload admin files and invoke the restricted production deployer
        env:
          QINGSU_CI_SSH_KEY: ${{ secrets.QINGSU_CI_SSH_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/qingsu-ssh"
          printf '%s' "$QINGSU_CI_SSH_KEY" > "$RUNNER_TEMP/qingsu-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/qingsu-ssh/id_ed25519"
          install -m 600 .github/deploy_known_hosts "$RUNNER_TEMP/qingsu-ssh/known_hosts"
          sha256sum "$RUNNER_TEMP/qingsu-admin.tar" > "$RUNNER_TEMP/qingsu-admin.sha256"
          read -r ARCHIVE_SHA _ < "$RUNNER_TEMP/qingsu-admin.sha256"
          scp -i "$RUNNER_TEMP/qingsu-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/qingsu-ssh/known_hosts" \
            "$RUNNER_TEMP/qingsu-admin.tar" \
            "qingsu-ci@124.220.54.64:/opt/qingsu/ci-incoming/admin-${GITHUB_RUN_ID}.tar"
          ssh -i "$RUNNER_TEMP/qingsu-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/qingsu-ssh/known_hosts" \
            qingsu-ci@124.220.54.64 \
            sudo -n /usr/local/sbin/qingsu-ci-deploy admin "$GITHUB_RUN_ID" "$ARCHIVE_SHA" "$GITHUB_SHA"
