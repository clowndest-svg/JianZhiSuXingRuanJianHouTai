# ==== 后台管理系统（qingsu-admin-console）====================================
# 安装时按下面这颗哨兵切开：哨兵以上的 limit_req_zone 只能出现在 http 上下文
# （必须在 server{ 之外），哨兵以下的 location 才拼进 server 块里。
#
# 为什么 Basic 不在 nginx 做：qingsu-tls 只把 default.conf 这一个文件挂进容器，
# htpasswd 就得落在容器可写层，容器一重建就丢，最坏形状是"nginx 起不动、整站下线"。
# 外层闸改放在运维 API 里（ops/admin_api.py 的 basic_gate_middleware，常数时间比对、可单测）。
#
# 为什么 /admin/ 之外还要代理一批根路径：Directus 11 的 Data Studio 在 /admin，
# 但它的 API 一直在**源站根路径**（/auth、/items、/collections…）。
# 只代理 /admin/ 的话页面能开、按钮全 404——实测 POST /admin/auth/login 拿回的是 SPA 的 HTML。
# 右边这批前缀主应用一个都没占（逐个实测 404），install-nginx.sh 装之前还会再核一遍。
# --- http 上下文 ---
    limit_req_zone $binary_remote_addr zone=adminpage:1m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=adminauth:1m rate=6r/m;
# --- server 上下文 ---
    location = /admin { return 301 /admin/; }
    location = /ops { return 301 /ops/; }

    # Data Studio 原生在 /admin，首页资源是相对路径（实测 <base href="/admin/">），保留前缀转发
    location /admin/ {
        limit_req zone=adminpage burst=120 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://172.17.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 登录与刷新单独收紧：爆破不该比刷页面便宜（放在通用那条之前，正则按顺序命中）
    location ~ ^/auth/(login|refresh) {
        limit_req zone=adminauth burst=5 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://172.17.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Directus 的 API（源站根路径）
    location ~ ^/(auth|items|collections|fields|schema|server|users|roles|policies|permissions|presets|relations|webhooks|flows|notifications|folders|files|dashboards|panels|translations|settings|themes|slides|diff|utils|extensions|assets|specification)(/|$) {
        limit_req zone=adminpage burst=120 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://172.17.0.1:8055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 运维台：这条带结尾斜杠，是要剥掉 /ops 前缀（页面里的 api/... 是相对路径）
    location /ops/ {
        limit_req zone=adminpage burst=60 nodelay;
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://172.17.0.1:8100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /ops/api/login {
        limit_req zone=adminauth burst=5 nodelay;
        proxy_pass http://172.17.0.1:8100/api/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /ops/api/backup {
        # 备份要跑整库快照 + 媒体打包，别用页面那 60 秒的读超时把它掐了
        limit_req zone=adminpage burst=10 nodelay;
        proxy_pass http://172.17.0.1:8100/api/backup;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }
